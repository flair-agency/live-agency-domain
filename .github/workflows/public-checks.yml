name: Public source checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public event revision without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          git init -q .
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Use the selected native TypeScript runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - name: Install locked type-check tools without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --userconfig=/dev/null
      - name: Type-check all native TypeScript tools without emitting code
        run: npm run typecheck
      - name: Check public source structure and links
        run: node tools/check-public-tree.mts
      - name: Check public knowledge plugin and packaged references
        run: node tools/check-plugin.mts && node tools/check-recognition-runtime.mts
      - name: Verify plugin sync safety and path containment regressions
        run: node --test tools/*.test.mts
      - name: Verify recognition calculations and build the package component
        run: |
          node --test packages/foreign-revenue-core/test/planner.test.mts
          npm run build --prefix packages/foreign-revenue-core

  source-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch public event revision without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          git init -q .
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Use the selected native TypeScript runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - name: Install locked type-check tools without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --userconfig=/dev/null
      - name: Type-check all native TypeScript tools without emitting code
        run: npm run typecheck
      - name: Check public source and plugin on Windows
        run: |
          node tools/check-public-tree.mts
          node tools/check-plugin.mts
          node tools/check-recognition-runtime.mts
          node --test --test-name-pattern 'clean payload|containment|hard-linked' tools/check-plugin.test.mts
